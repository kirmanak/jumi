name: OpenCode Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

  image-build:
    runs-on: large-ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Build image without publishing
        run: bash .gitea/scripts/build-reviewer-image.sh jumi-reviewer:ci
