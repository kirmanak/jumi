name: OpenCode Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

  image-build:
    # GARM Buildah path (same as main publish). Not Akka/Kaniko.
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Build image without publishing
        run: bash .gitea/scripts/build-reviewer-image.sh jumi-reviewer:ci

  worker-image-build:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Build worker image without publishing
        run: bash .gitea/scripts/build-worker-image.sh jumi-worker:ci
