name: Build Jumi Reviewer Image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: gitea.kirmanak.stream/kirmanak/jumi-reviewer
      REGISTRY: gitea.kirmanak.stream

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Run lint, typecheck, and tests
        run: bun run ci
        working-directory: scripts/opencode

      - name: Build and push image
        env:
          PUSH_IMAGE: "true"
          CONTAINER_REGISTRY_USER: ${{ vars.CONTAINER_REGISTRY_USER }}
          CONTAINER_REGISTRY_PASS: ${{ secrets.CONTAINER_REGISTRY_PASS }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tags=("${IMAGE}:${COMMIT_SHA}")
          if [ "${REF_NAME}" = "main" ]; then
            tags+=("${IMAGE}:latest")
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            tags+=("${IMAGE}:${REF_NAME}")
          fi
          bash .gitea/scripts/build-reviewer-image.sh "${tags[@]}"
