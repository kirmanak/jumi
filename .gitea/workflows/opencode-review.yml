name: OpenCode PR Auto-Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Load tool versions
        run: grep -v '^#' .gitea/tool-versions.env >> $GITHUB_ENV

      - name: Install script dependencies
        run: bun install --frozen-lockfile
        working-directory: scripts/opencode

      - name: Set up OpenCode
        uses: ./.gitea/actions/setup-opencode
        with:
          opencode-version: ${{ env.OPENCODE_VERSION }}

      - name: Run OpenCode review
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN }}
          BOT_USERNAME: jumi
          BOT_EMAIL: jumi@kirmanak.stream
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          LITELLM_AI_KEY: ${{ secrets.LITELLM_AI_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/.gitea/opencode.json
        run: bun run src/main.ts
        working-directory: scripts/opencode
