name: Setup OpenCode
description: Install OpenCode CLI to ~/.local/bin and add to PATH

runs:
  using: composite
  steps:
    - name: Install OpenCode CLI
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        if [ ! -e ~/.local/bin/opencode ]; then
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mv /tmp/opencode ~/.local/bin/opencode
          chmod 755 ~/.local/bin/opencode
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"