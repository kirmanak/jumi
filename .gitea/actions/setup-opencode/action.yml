name: Setup OpenCode
description: Install OpenCode CLI to ~/.local/bin and add to PATH

inputs:
  opencode-version:
    description: OpenCode version to install
    required: true

runs:
  using: composite
  steps:
    - name: Install OpenCode CLI
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  PLATFORM="linux-x64" ;;
          aarch64) PLATFORM="linux-arm64" ;;
          *)       echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
        esac
        curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${{ inputs.opencode-version }}/opencode-${PLATFORM}.tar.gz" \
          -o /tmp/opencode.tar.gz
        tar -xzf /tmp/opencode.tar.gz -C /tmp
        mv /tmp/opencode ~/.local/bin/opencode
        chmod 755 ~/.local/bin/opencode
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
