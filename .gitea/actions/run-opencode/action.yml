name: Run OpenCode
description: Download, set up, and run the OpenCode AI agent

inputs:
  gitea-token:
    description: Gitea API token (used for downloading scripts and agent API calls)
    required: true
  opencode-model:
    description: OpenCode model identifier
    required: true
  opencode-go-api-key:
    description: OpenCode Go API key
    required: true
  copilot-github-key:
    description: Copilot GitHub key
    required: false
    default: ""
  bot-username:
    description: Bot account login name
    required: false
    default: jumi
  bot-email:
    description: Bot commit email
    required: false
    default: jumi@kirmanak.stream

runs:
  using: composite
  steps:
    - name: Download OpenCode agent
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.gitea-token }}
      run: |
        mkdir -p /tmp/jumi
        curl -sL -H "Authorization: token ${GITEA_TOKEN}" \
          "${{ github.server_url }}/api/v1/repos/personal/jumi/archive/main.tar.gz" \
          | tar xz -C /tmp/jumi --strip-components=1

    - name: Load tool versions
      shell: bash
      run: grep -v '^#' /tmp/jumi/.gitea/tool-versions.env >> "$GITHUB_ENV"

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest

    - name: Install script dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: /tmp/jumi/scripts/opencode

    - name: Set up OpenCode
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        if [ ! -e ~/.local/bin/opencode ]; then
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mv /tmp/opencode ~/.local/bin/opencode
          chmod 755 ~/.local/bin/opencode
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run OpenCode agent
      shell: bash
      env:
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.gitea-token }}
        BOT_USERNAME: ${{ inputs.bot-username }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        OPENCODE_MODEL: ${{ inputs.opencode-model }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        OPENCODE_GO_API_KEY: ${{ inputs.opencode-go-api-key }}
        COPILOT_GITHUB_KEY: ${{ inputs.copilot-github-key }}
        OPENCODE_CONFIG: /tmp/jumi/.gitea/opencode.json
      run: bun run src/main.ts
      working-directory: /tmp/jumi/scripts/opencode