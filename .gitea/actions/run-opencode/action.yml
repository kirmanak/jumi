name: Run OpenCode
description: Download, set up, and run the OpenCode AI agent

inputs:
  gitea-token:
    description: Gitea API token
    required: true
  opencode-model:
    description: OpenCode model identifier
    required: true
  litellm-api-key:
    description: LiteLLM API key
    required: false
    default: ""
  bot-username:
    description: Bot account login name
    required: false
    default: jumi
  bot-email:
    description: Bot commit email
    required: false
    default: jumi@kirmanak.stream

runs:
  using: composite
  steps:
    - name: Download OpenCode agent
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.gitea-token }}
      run: |
        mkdir -p /tmp/jumi
        curl -fsSL -H "Authorization: token ${GITEA_TOKEN}" \
          "${{ github.server_url }}/api/v1/repos/personal/jumi/archive/main.tar.gz" \
          | tar xz -C /tmp/jumi --strip-components=1

    - name: Load tool versions
      shell: bash
      run: grep -v '^#' /tmp/jumi/.gitea/tool-versions.env >> "$GITHUB_ENV"

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Install script dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: /tmp/jumi/scripts/opencode

    - name: Set up OpenCode
      shell: bash
      run: |
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  PLATFORM=linux-x64 ;;
          aarch64) PLATFORM=linux-arm64 ;;
          arm64)   PLATFORM=linux-arm64 ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        mkdir -p ~/.local/bin
        curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-${PLATFORM}.tar.gz" \
          -o /tmp/opencode.tar.gz
        tar -xzf /tmp/opencode.tar.gz -C /tmp
        mv /tmp/opencode ~/.local/bin/opencode
        chmod 755 ~/.local/bin/opencode
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run OpenCode agent
      shell: bash
      env:
        GITEA_URL: ${{ github.server_url }}
        GITEA_TOKEN: ${{ inputs.gitea-token }}
        BOT_USERNAME: ${{ inputs.bot-username }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        OPENCODE_MODEL: ${{ inputs.opencode-model }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        LITELLM_AI_KEY: ${{ inputs.litellm-api-key }}
        OPENCODE_CONFIG: /tmp/jumi/.gitea/opencode.json
      run: bun run src/main.ts
      working-directory: /tmp/jumi/scripts/opencode
